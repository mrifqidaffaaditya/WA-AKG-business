# ═════════════════════════════════════════════════════════════════════════════
# WA-AKG Business — Generic Full Nginx Configuration
# Can be placed in /etc/nginx/sites-available/wa-akg-business.conf
# ═════════════════════════════════════════════════════════════════════════════

upstream wa_backend {
    server 127.0.0.1:4005;
    keepalive 32;
}

upstream wa_frontend {
    server 127.0.0.1:4041;
    keepalive 32;
}

# ── HTTP -> HTTPS Redirect (Optional if handled by Cloudflare) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name wa-akg-business.aikeigroup.net;

    # Allow Let's Encrypt / ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Production HTTPS Server ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wa-akg-business.aikeigroup.net;

    # SSL Certificates (Adjust paths to your SSL certificates or Cloudflare Origin CA)
    # ssl_certificate /etc/letsencrypt/live/wa-akg-business.aikeigroup.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wa-akg-business.aikeigroup.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://cloudflareinsights.com; frame-src 'self'; object-src 'none'; base-uri 'self';" always;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── 1. Realtime WebSocket (Socket.io) ────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://wa_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── 2. Backend REST API v1, Auth & Docs ──────────────────────────────────
    location /api/ {
        proxy_pass http://wa_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 3. WhatsApp Media & Uploads ──────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://wa_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── 4. Next.js Static Chunks & Build Artifacts ──────────────────────────
    location /_next/ {
        proxy_pass http://wa_frontend/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering on;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 5. Next.js Frontend UI (Root) ───────────────────────────────────────
    location / {
        proxy_pass http://wa_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}
