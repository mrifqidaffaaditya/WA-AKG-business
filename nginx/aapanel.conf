# ═════════════════════════════════════════════════════════════════════════════
# WA-AKG Business — aaPanel Customized Configuration File
# Paste this into aaPanel -> Website -> Settings -> Customized Configuration Files
# (Do NOT include 'location /' because aaPanel Reverse Proxy already defines it!)
# ═════════════════════════════════════════════════════════════════════════════

# 1. Realtime WebSockets (Socket.io) — WhatsApp chat & live events
location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:4005/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Keep WebSocket connection open 24h
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# 2. Backend REST API v1, Auth & OpenAPI Docs
location ^~ /api/ {
    proxy_pass http://127.0.0.1:4005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 3. WhatsApp Media & Uploaded Files
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4005/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    expires 30d;
}
