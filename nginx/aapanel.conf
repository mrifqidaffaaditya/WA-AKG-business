# ═════════════════════════════════════════════════════════════════════════════
# WA-AKG Business — aaPanel Website Configuration Snippet
# Paste this block into: aaPanel -> Website -> Settings -> Config (within server { ... })
# ═════════════════════════════════════════════════════════════════════════════

# Max body size for WhatsApp media attachments (audio, video, documents, images)
client_max_body_size 100M;

# ── 1. Realtime WebSocket (Socket.io) ────────────────────────────────────────
# WA connection status, incoming messages, live dashboard events, webhook logs
location /socket.io/ {
    proxy_pass http://127.0.0.1:4005/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Keep long-lived WebSocket connections open without premature timeout
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# ── 2. Backend REST API v1, Auth & Docs ───────────────────────────────────────
location /api/ {
    proxy_pass http://127.0.0.1:4005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ── 3. WhatsApp Media & Uploads ──────────────────────────────────────────────
location /uploads/ {
    proxy_pass http://127.0.0.1:4005/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    expires 30d;
    add_header Cache-Control "public, no-transform";
}

# ── 4. Next.js Static Chunks & Build Artifacts ──────────────────────────────
location /_next/ {
    proxy_pass http://127.0.0.1:4041/_next/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Aggressive caching for immutable static assets
    proxy_buffering on;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# ── 5. Next.js Frontend UI (Root) ───────────────────────────────────────────
location / {
    proxy_pass http://127.0.0.1:4041/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
}
